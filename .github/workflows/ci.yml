name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  python-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse helper scripts without generating bytecode
        run: python3 -c 'import ast, pathlib; [ast.parse(path.read_text(), filename=str(path)) for path in pathlib.Path("docker/scripts").glob("*.py")]'

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the shared base image
        run: docker build -t harness-hat-base:local -f docker/harness-hat-base.dockerfile docker
      - name: Build every language image
        run: |
          for template in default typescript python go rust kotlin android php csharp; do
            docker build -t "harness-hat-${template}:ci" -f "docker/${template}.dockerfile" docker
          done
      - name: Smoke-test the installed toolchains
        run: |
          docker run --rm --entrypoint dotnet harness-hat-csharp:ci --list-sdks
          docker run --rm --entrypoint bun harness-hat-typescript:ci --version
          docker run --rm --entrypoint uv harness-hat-python:ci --version
          docker run --rm --entrypoint go harness-hat-go:ci version
          docker run --rm --entrypoint rustc harness-hat-rust:ci --version
          docker run --rm --entrypoint kotlinc harness-hat-kotlin:ci -version
          docker run --rm --entrypoint adb harness-hat-android:ci version
          docker run --rm --entrypoint sdkmanager harness-hat-android:ci --version
