name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: hat
            archive: hat-aarch64-apple-darwin.zip
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: hat.exe
            archive: hat-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hat
            archive: hat-x86_64-unknown-linux-gnu.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: make build-macos

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make build-linux

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os == 'Linux'
        run: |
          zip -j ${{ matrix.archive }} \
            target/${{ matrix.target }}/release/${{ matrix.artifact }} \
            target/${{ matrix.target }}/release/hat-daemon

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          zip -j ${{ matrix.archive }} \
            target/${{ matrix.target }}/release/${{ matrix.artifact }} \
            target/${{ matrix.target }}/release/hat-daemon \
            target/${{ matrix.target }}/release/hat-launcher
          cd target/${{ matrix.target }}/release
          zip -r "$GITHUB_WORKSPACE/${{ matrix.archive }}" "Harness Hat.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\${{ matrix.artifact }}", "target\${{ matrix.target }}\release\hat-daemon.exe", "target\${{ matrix.target }}\release\hat-launcher.exe" `
            -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
