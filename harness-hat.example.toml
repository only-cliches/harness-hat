# harness-hat.example.toml
#
# Main manager config for Harness Hat.
# Network policy and optional instructions live in each workspace's
# harness-rules.toml file.

version = 1

# Directory used to resolve Dockerfiles and the Docker build context.
docker_dir = __HARNESS_HAT_DOCKER_DIR__

[manager]
# Global network rules file used by the manager for persisted approvals.
global_rules_file = "~/.config/harness-hat/harness-rules.toml"

[defaults.ui]
sidebar_width = 32
show_log_pane = false

[defaults.control]
# Local authenticated control server used by killme and session identity.
# Bind to loopback only. Setting a non-loopback host requires
# `allow_remote_control = true` and exposes the control API to the network.
server_port = 7878
server_host = "127.0.0.1"
# allow_remote_control = false
token_env_var = "HARNESS_HAT_TOKEN"

[defaults.proxy]
# Bind the MITM proxy to loopback only. Non-loopback proxy hosts require
# `allow_remote_control = true` and turn the proxy into a network-reachable
# MITM relay.
proxy_port = 28781
proxy_host = "127.0.0.1"
strict_network = true

[logging]
log_dir = "~/.local/share/harness-hat"

[defaults.containers]
env_passthrough = ["TERM", "COLORTERM", "COLORFGBG", "ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN"]
allowed_hosts = [
  "api.anthropic.com",
  "claude.ai",
  "platform.claude.com",
  "downloads.claude.ai",
  "storage.googleapis.com",
  "chatgpt.com",
  "*.chatgpt.com",
  "*.openai.com",
  "api.openai.com",
  "chat.openai.com",
  "auth.openai.com",
  "*.googleapis.com",
  "generativelanguage.googleapis.com",
  "aistudio.google.com",
  "antigravity.google",
  "accounts.google.com",
  "oauth2.googleapis.com",
  "www.googleapis.com",
  "openrouter.ai",
  "api.openrouter.ai",
  "db.chatgpt.com",
  "raw.githubusercontent.com",
  "github.com"
]

# Shared session-state mounts applied to every template.
# These keep the agent CLIs' auth/session caches available across launches.
#
# Claude Code reads session state from both `~/.claude.json` and
# `~/.claude/.claude.json` depending on command path/version. These files are
# rewritten in place by every Claude Code instance, so sharing the host's live
# file lets the host and container(s) race and corrupt it ("JSON Parse error:
# Unterminated string"), which resets the config and logs the container out.
# They are therefore seeded as private per-session copies: the container reads
# the current session through at launch, then owns the files privately and never
# writes back to the host. Set `seed = false` to restore a shared live bind
# mount, or add `seed = true` to any other file mount to privatize it the same
# way. (Unset defaults to seeding `.claude.json` only.)
[[defaults.containers.mounts]]
host = "~/.claude.json"
container = "/home/coder/.claude.json"
mode = "rw"
seed = true

[[defaults.containers.mounts]]
host = "~/.claude/.claude.json"
container = "/home/coder/.claude/.claude.json"
mode = "rw"
seed = true

# The full `~/.claude` mount below shares the host's `.credentials.json`, which
# holds the subscription OAuth access/refresh token. When the container is
# launched with a CLAUDE_CODE_OAUTH_TOKEN (the default), interactive Claude
# prefers that stored token over the env var, but it's usually expired and its
# refresh token can't be rotated back to the host, so the TUI 401s ("Please run
# /login") even though `claude -p` works. Seeding shadows it with an empty file
# so the TUI falls back to the env token. (harness-hat empties seeded
# `.credentials.json` whenever env-token auth is active.)
[[defaults.containers.mounts]]
host = "~/.claude/.credentials.json"
container = "/home/coder/.claude/.credentials.json"
mode = "rw"
seed = true

[[defaults.containers.mounts]]
host = "~/.claude"
container = "/home/coder/.claude"
mode = "rw"

[[defaults.containers.mounts]]
host = "~/.codex"
container = "/home/coder/.codex"
mode = "rw"

[[defaults.containers.mounts]]
host = "~/.config/codex"
container = "/home/coder/.config/codex"
mode = "rw"

[[defaults.containers.mounts]]
# Antigravity CLI uses ~/.gemini/antigravity-cli for settings/history. Login
# tokens live in the OS keyring, so the base image starts a Linux Secret Service
# and persists it through a dedicated keyrings mount. harness-hat injects that
# keyrings mount automatically (host: <user data dir>/harness-hat/container-keyrings
# -> /home/coder/.local/share/keyrings) - do not add it here, or the duplicate
# container destination will fail `docker run` with "Duplicate mount point".
host = "~/.gemini"
container = "/home/coder/.gemini"
mode = "rw"

[[defaults.containers.mounts]]
host = "~/.pi"
container = "/home/coder/.pi"
mode = "rw"

# Optional defaults applied to every template.
# mount_target = "/workspace"
# memory = "16g"
# cpus = "2"
# shm_size = "1g"

# Forward a host-local OpenAI-compatible model server (e.g. Ollama) into
# every session as http://localhost:8081, so agents like pi that store
# baseUrl = "http://localhost:8081/v1" in their config can reach it.
[[defaults.containers.localhost_forwards]]
container_port = 8081
host_port = 8081

# ---------------------------------------------------------------------------
# Docker templates.
#
# Each [container_profiles.<name>] entry is a launchable Docker image template.
# `image` is a Dockerfile stem resolved as <docker_dir>/<image>.dockerfile.
# If `command` is omitted, Docker runs the image's default command.
# ---------------------------------------------------------------------------

[container_profiles.typescript]
image = "typescript"
memory = "4g"
cpus = "2"
shm_size = "1g"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=registry.npmjs.org",
  "domain=*.npmjs.org",
  "domain=bun.sh",
]

[container_profiles.go]
image = "go"
memory = "4g"
cpus = "2"
shm_size = "1g"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=pkg.go.dev",
  "domain=proxy.golang.org",
  "domain=sum.golang.org",
]

[container_profiles.rust]
image = "rust"
memory = "6g"
cpus = "3"
shm_size = "1g"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=crates.io",
  "domain=static.crates.io",
  "domain=index.crates.io",
]

[container_profiles.php]
image = "php"
memory = "4g"
cpus = "2"
shm_size = "1g"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=getcomposer.org",
  "domain=packagist.org",
  "domain=repo.packagist.org",
]

[container_profiles.dotnet]
image = "dotnet"
memory = "4g"
cpus = "2"
shm_size = "1g"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=nuget.org",
  "domain=*.nuget.org",
  "domain=api.nuget.org",
  "domain=packages.microsoft.com",
]

[container_profiles.base]
image = "default"
starter_network_allowlist = [
  "domain=github.com",
  "domain=api.github.com",
  "domain=raw.githubusercontent.com",
  "domain=objects.githubusercontent.com",
  "domain=registry.npmjs.org",
  "domain=*.npmjs.org",
  "domain=pypi.org",
  "domain=files.pythonhosted.org",
  "domain=crates.io",
  "domain=static.crates.io",
  "domain=index.crates.io",
  "domain=antigravity-unleash.goog",
  "domain=playwright.azureedge.net",
  "domain=play.googleapis.com",
  "domain=playwright-akamai.azureedge.net",
  "domain=playwright-verizon.azureedge.net",
  "domain=oauth2.googleapis.com",
  "domain=www.googleapis.com",
  "domain=daily-cloudcode-pa.googleapis.com",
  "domain=lh3.googleusercontent.com",
]

# Larger development environment example.
[container_profiles.large]
image = "default"
memory = "8g"
cpus = "4"
shm_size = "2g"

# Optional extra mounts for tool credentials or caches.
# [[container_profiles.large.mounts]]
# host = "~/.gitconfig"
# container = "/home/coder/.gitconfig"
# mode = "ro"

# Optional fixed command override. Prefer leaving this unset for shell-first
# sessions unless a template needs a specific entrypoint.
# command = ["/bin/bash"]

# Optional per-template env passthrough.
# env_passthrough = ["OPENAI_API_KEY"]

# Optional hosts allowed by default without network approval for this template.
# allowed_hosts = ["api.example.com", "*.example.org"]

# Optional container-local TCP forwards to host services.
# [[container_profiles.large.localhost_forwards]]
# container_port = 8081
# host_port = 8081

