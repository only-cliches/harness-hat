# ---------------------------------------------------------------------------
# MCP servers
#
# Claude Code discovers MCP servers from ~/.claude/settings.json (already
# mounted via the global ~/.claude mount). Add server definitions there and
# they are available in every session automatically.
#
# The MCP server process runs inside the container. If it needs to reach an
# external API, add that host to the profile's allowed_hosts or approve it
# at runtime through the TUI network approval dialog.
#
# For tokens/secrets, use env_passthrough — the value never touches disk
# inside the container:
#   env_passthrough = ["MY_API_KEY"]
#
# harness-hat can scrape MCP server log files for startup diagnostics.
# Point mcp_log_paths at the file(s) your server writes to, and optionally
# set mcp_log_pattern to a grep pattern shown in the TUI on launch failure:
#   mcp_log_paths = ["/home/coder/.cache/my-mcp/server.log"]
#   mcp_log_pattern = "ERROR|WARN|listening on"
# ---------------------------------------------------------------------------

